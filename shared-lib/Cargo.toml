[package]
name = "shared-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
postgres-types = { version = "0.2.13", features = ["chrono-04", "derive"] }
tokio-postgres = { version = "0.7.17", features = ["array-impls", "js", "with-chrono-0_4"] }
serde = { version = "1.0.228", features = ["derive"] }
colored = "3.1.1"
