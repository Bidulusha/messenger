<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/static/styles/sign_up_page/form.css" rel="stylesheet">
    <link href="/static/styles/sign_up_page/style.css" rel="stylesheet">
    <link href="/static/styles/base_style.css" rel="stylesheet">
    <title>Регистрация нового аккаунта</title>
</head>
<body>
    <div id="form">
        <form method="post">
            <section>
                <h3>Создать аккаунт</h3>
            </section>
            <section>
                <!-- Email -->
                <div class="form__input-div">
                    <!-- <label for="form__login">Логин</label> -->
                    <input type="email" id="form__login" name="email" placeholder="Введите почту" required/>
                </div>
                <!-- Login -->
                <div class="form__input-div">
                    <!-- <label for="form__login">Логин</label> -->
                    <input type="text" id="form__login" name="login" placeholder="Введите логин" required/>
                </div>
                <!-- Password -->
                <div class="form__input-div">
                    <!-- <label for="password">Пароль</label> -->
                    <input type="password" id="password" name="password" maxlength="128" placeholder="Введите пароль" required/>
                </div>
                <!-- Password check -->
                <div class="form__input-div">
                    <!-- <label for="password">Пароль</label> -->
                    <input type="password" id="password" maxlength="128" placeholder="Повторите пароль" required/>
                </div>
            </section>
            <section>
                <div class="form__button-div button-sign-in">
                    <button>Создать аккаунт</button>  
                </div>
                <div class="form__button-div button-sign-up">
                    <a href="/sign_in"><button type="button">Уже зарегестрирован</button></a>
                </div>
            </section>
        </form>
    </div>
</body>
</html>
